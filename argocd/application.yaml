apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: university-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ohmattapon/university-lab
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: university-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
