server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # edge health endpoint
  location = /health {
    access_log off;
    add_header Content-Type application/json;
    return 200 '{"status":"ok","service":"frontend"}\n';
  }

  # NOTE: /api/* is routed by the Kubernetes Ingress to the backend
  # Service. This nginx serves static files only, so the image stays
  # runnable standalone (no upstream DNS needed at startup).

  location / {
    try_files $uri $uri/ /index.html;
  }
}
